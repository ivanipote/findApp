<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1976d2" />
    <title>👤 Mon Profil - easily by megane</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="me.css" />
</head>
<body>

    <!-- ============================================================ -->
    <!-- HEADER -->
    <!-- ============================================================ -->
    <header class="header-profile" id="headerProfile">
        <button class="back-btn" id="backBtn" type="button" aria-label="Retour">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="email" id="userEmail">📧 Chargement...</span>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu">
            <i class="fas fa-ellipsis-v"></i>
        </button>
    </header>

    <!-- ============================================================ -->
    <!-- PSEUDO BARRE -->
    <!-- ============================================================ -->
    <div class="pseudo-bar">
        <span class="pseudo-label">ID :</span>
        <span class="pseudo-value" id="userPseudo">--</span>
        <button class="pseudo-reset" id="resetPseudoBtn">
            <i class="fas fa-undo"></i> Reset
        </button>
    </div>

    <!-- ============================================================ -->
    <!-- DROPDOWN MENU -->
    <!-- ============================================================ -->
    <div class="dropdown-menu" id="dropdownMenu">
        <button class="dropdown-item" id="navPositions" type="button">
            <i class="fas fa-map-pin"></i> Mes positions
        </button>
        <button class="dropdown-item" id="navRestore" type="button">
            <i class="fas fa-sync"></i> Restaurer ma session
        </button>
        <button class="dropdown-item danger" id="navLogout" type="button">
            <i class="fas fa-sign-out-alt"></i> Déconnexion
        </button>
    </div>

    <!-- ============================================================ -->
    <!-- CONTENU -->
    <!-- ============================================================ -->
    <div class="profile-container">

        <!-- ============================================================ -->
        <!-- CADRE 1 : PARTAGE DE POSITION -->
        <!-- ============================================================ -->
        <div class="card share-card">
            <div class="card-title">
                <i class="fas fa-share-alt"></i> Partage de position
            </div>

            <!-- SECTION 1 : Partager -->
            <div class="settings-item">
                <div class="icon" style="background:#1976d2;">
                    <i class="fas fa-share-alt"></i>
                </div>
                <div class="info">
                    <div class="label">Partager ma position</div>
                    <div class="description">Activer le partage en continu</div>
                </div>
                <div class="right">
                    <div class="toggle-samsung" id="shareToggle">
                        <span class="thumb"></span>
                    </div>
                </div>
            </div>

            <!-- SECTION 2 : Code -->
            <div class="settings-item">
                <div class="icon" style="background:#2ecc71;">
                    <i class="fas fa-key"></i>
                </div>
                <div class="info">
                    <div class="label">Code de partage</div>
                    <div class="code-samsung">
                        <span class="code-value" id="shareCode">Aucun code</span>
                        <button class="btn-copy" id="copyCodeBtn"><i class="fas fa-copy"></i></button>
                    </div>
                </div>
                <div class="right">
                    <button class="btn-reset-samsung" id="resetCodeBtn"><i class="fas fa-undo"></i></button>
                </div>
            </div>

            <!-- SECTION 3 : Envoyer (Email / Pseudo) -->
            <div class="settings-item">
                <div class="icon" style="background:#e67e22;">
                    <i class="fas fa-paper-plane"></i>
                </div>
                <div class="info">
                    <div class="label">Envoyer le code</div>
                    <div class="description">Partager avec un contact</div>
                </div>
                <div class="right send-area">

                    <!-- Mode Email -->
                    <div class="send-mode email-mode" id="emailMode">
                        <input type="email" id="shareEmail" placeholder="Email du destinataire..." />
                    </div>

                    <!-- Mode Pseudo -->
                    <div class="send-mode pseudo-mode" id="pseudoMode" style="display:none;">
                        <div class="pseudo-input-group">
                            <input type="text" id="pseudoPrefix" placeholder="IP" maxlength="2" class="pseudo-part" />
                            <span class="pseudo-separator">-</span>
                            <input type="text" id="pseudoNumber" placeholder="23" maxlength="2" class="pseudo-part" />
                            <span class="pseudo-separator">-</span>
                            <input type="text" id="pseudoLetter" placeholder="M" maxlength="1" class="pseudo-part pseudo-letter" />
                        </div>
                    </div>

                    <!-- Toggle Email / Pseudo -->
                    <button class="btn-toggle-mode" id="toggleModeBtn" type="button" title="Basculer vers Pseudo">
                        <i class="fas fa-exchange-alt"></i>
                    </button>

                    <button class="btn-send" id="sendEmailBtn">
                        <i class="fas fa-paper-plane"></i> Envoyer
                    </button>
                </div>
            </div>

        </div>

        <!-- ============================================================ -->
        <!-- CADRE 2 : HISTORIQUE (STYLE 2) -->
        <!-- ============================================================ -->
        <div class="card history-card">
            <div class="tabs">
                <div class="tab active" data-tab="received">
                    <i class="fas fa-inbox"></i> Reçus
                    <span class="badge-count" id="receivedBadge">0</span>
                </div>
                <div class="tab" data-tab="sent">
                    <i class="fas fa-paper-plane"></i> Envoyés
                    <span class="badge-count" id="sentBadge">0</span>
                </div>
            </div>
            <div class="history-content" id="historyContent">
                <!-- Rempli par JS -->
            </div>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================================ -->
    <script src="me.js"></script>

</body>
</html>
