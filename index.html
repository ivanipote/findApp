<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="easily by megane — trouvez des lieux autour de vous et suivez vos proches" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>easily by megane</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-512.png" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- MapLibre GL JS - CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" />
    
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ============================================================ -->
    <!-- HEADER -->
    <!-- ============================================================ -->
    <header class="header-search" id="searchHeader">
        <i class="fas fa-search icon"></i>
        <input type="text" id="searchInput" placeholder="Rechercher un lieu..." readonly />
        <button class="menu-dots" id="menuDots" type="button" aria-label="Menu">
            <i class="fas fa-ellipsis-v"></i>
        </button>
        <div class="dropdown-menu" id="dropdownMenu">
            <button class="dropdown-item" id="navAdd" type="button">
                <i class="fas fa-plus-circle"></i> Add place
            </button>
            <button class="dropdown-item" id="navMe" type="button">
                <i class="fas fa-user"></i> <span id="navMeLabel">Se connecter</span>
            </button>
            <button class="dropdown-item" id="navFollow" type="button">
                <i class="fas fa-eye"></i> <span id="navFollowLabel">Suivre quelqu'un</span>
            </button>
            <button class="dropdown-item" id="navMesPositions" type="button">
                <i class="fas fa-map-pin"></i> Mes positions
            </button>
        </div>
    </header>

    <!-- ============================================================ -->
    <!-- MAIN -->
    <!-- ============================================================ -->
    <main class="main">

        <!-- CATÉGORIES -->
        <section class="categories-section" id="categoriesSection">
            <div class="categories-header">
                <span class="categories-title"><i class="fas fa-tags"></i> Catégories</span>
                <button class="btn-reset-categories" id="resetCategories" type="button"><i class="fas fa-undo"></i> Tout</button>
            </div>
            <div class="categories-grid" id="categoriesGrid">
                <!-- Généré par JavaScript -->
            </div>
        </section>

        <!-- CARTE -->
        <section class="position-card" id="positionCard">
            <div class="card-header">
                <div class="left">
                    <button class="toggle-btn" id="toggleFollow" type="button">
                        <span class="toggle-track"><span class="toggle-thumb"></span></span>
                        Suivre
                    </button>
                    <button class="btn-center" id="btnCenterMe" type="button" title="Centrer sur ma position">
                        <i class="fas fa-location-dot"></i>
                    </button>
                    <button class="btn-center" id="btnCenterFollow" type="button" title="Centrer sur la personne suivie">
                        <i class="fas fa-user"></i>
                    </button>
                </div>
                <div class="right">
                    <span class="info-item"><i class="fas fa-location-dot"></i> <span id="posStatus">--</span></span>
                </div>
            </div>
            <div id="map"></div>
        </section>

    </main>

    <!-- ============================================================ -->
    <!-- OVERLAY SUIVRE QUELQU'UN -->
    <!-- ============================================================ -->
    <div class="follow-overlay" id="followOverlay">
        <div class="follow-sheet">
            <span class="follow-handle"></span>

            <div class="follow-header">
                <h2><i class="fas fa-eye"></i> Suivre quelqu'un</h2>
                <button class="close-follow" id="closeFollow"><i class="fas fa-times"></i></button>
            </div>

            <div class="follow-content">
                <div class="follow-loader" id="followLoader">
                    <div class="dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <p class="loader-text">Vérification du code...</p>
                </div>

                <div class="follow-input-area" id="followInputArea">
                    <div class="follow-icon">
                        <i class="fas fa-key"></i>
                    </div>
                    <p class="follow-subtitle">Entrez le code de la personne à suivre</p>
                    <div class="follow-input-group">
                        <input type="text" id="followCode" placeholder="Ex: MAMA-007" maxlength="8" autocomplete="off" />
                        <button class="btn-follow-confirm" id="followConfirmBtn">
                            <i class="fas fa-check"></i> Confirmer
                        </button>
                    </div>
                    <div class="follow-error" id="followError">Code invalide. Veuillez réessayer.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- SLIDER SUIVI (info de la personne suivie) -->
    <!-- ============================================================ -->
    <div class="track-slider" id="trackSlider">
        <div class="track-sheet">
            <div class="track-header">
                <span class="track-email" id="trackEmail">📧 email@exemple.com</span>
                <button class="track-close" id="trackClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="track-timestamp" id="trackTimestamp">⏱️ Dernière mise à jour : ...</div>
            <div class="track-body">
                <div class="track-info">
                    <div class="track-stat">
                        <span class="track-stat-value" id="trackDistance">--</span>
                        <span class="track-stat-label">Km</span>
                    </div>
                    <div class="track-stat">
                        <span class="track-stat-value" id="trackTime">--</span>
                        <span class="track-stat-label">Min</span>
                    </div>
                </div>
                <button class="track-btn" id="trackActionBtn">
                    <i class="fas fa-route"></i> <span id="trackBtnLabel">Mettre à jour</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- OVERLAY REDIRECTION -->
    <!-- ============================================================ -->
    <div class="redirect-overlay" id="redirectOverlay">
        <div class="wave-container">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div class="redirect-text">
            <i class="fas fa-spinner"></i> Veuillez patienter...
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TOAST -->
    <!-- ============================================================ -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================================ -->
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="index.js"></script>

</body>
</html>
