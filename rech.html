<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🔍 Recherche - easily by megane</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />

    <style>
        /* ============================================================ */
        /* PAGE RECHERCHE - AVEC TOGGLES MONDE / LOCAL */
        /* ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-top: 76px;
            padding-bottom: 20px;
            margin: 0;
        }

        /* ============================================================ */
        /* HEADER - AVEC TOGGLES */
        /* ============================================================ */
        .header-search {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            height: 60px;
            background: #ffffff;
            border-radius: 35px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 3px solid #1976d2;
            max-width: 480px;
            margin: 0 auto;
        }

        @media (min-width: 480px) {
            .header-search {
                left: 50%;
                transform: translateX(-50%);
                right: auto;
                top: 12px;
            }
        }

        .header-search .back-btn {
            background: none;
            border: none;
            color: #1976d2;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .header-search .back-btn:hover {
            background: #f0f2f5;
        }

        .header-search .icon {
            color: #1976d2;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .header-search input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 0.9rem;
            color: #1a2a5a;
            background: transparent;
            height: 100%;
            min-width: 60px;
        }

        .header-search input::placeholder {
            color: #aab4c8;
        }

        .header-search .clear-btn {
            background: none;
            border: none;
            color: #aab4c8;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 4px;
            display: none;
            flex-shrink: 0;
        }

        .header-search .clear-btn.visible {
            display: block;
        }

        /* ============================================================ */
        /* TOGGLES MONDE / LOCAL */
        /* ============================================================ */
        .toggle-group {
            display: flex;
            gap: 3px;
            background: #f0f2f5;
            border-radius: 20px;
            padding: 3px;
            flex-shrink: 0;
        }

        .toggle-group .toggle-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 16px;
            font-size: 0.6rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
            background: transparent;
            color: #8a9aaa;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .toggle-group .toggle-btn i {
            font-size: 0.65rem;
        }

        .toggle-group .toggle-btn:hover {
            color: #1a2a5a;
        }

        .toggle-group .toggle-btn.active {
            background: #1976d2;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.3);
        }

        .toggle-group .toggle-btn.active i {
            color: #ffffff;
        }

        /* ============================================================ */
        /* BADGE SOURCE */
        /* ============================================================ */
        .source-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.5rem;
            font-weight: 600;
            color: #8a9aaa;
            background: #f0f2f5;
            padding: 3px 10px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .source-badge i {
            color: #1976d2;
            font-size: 0.6rem;
        }

        .source-badge .badge-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #2ecc71;
            display: inline-block;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* ============================================================ */
        /* CONTAINER RÉSULTATS */
        /* ============================================================ */
        .results-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        @media (max-width: 480px) {
            .results-container {
                padding: 0 10px;
                gap: 12px;
            }
        }

        /* ============================================================ */
        /* CARTE RÉSULTAT - STYLE 9 */
        /* ============================================================ */
        .result-card-wrapper {
            background: #ffffff;
            border-radius: 16px;
            padding: 8px;
            border: 1px solid #e8ecf4;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            cursor: pointer;
            width: 100%;
        }

        .result-card-wrapper:hover {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.10);
            transform: translateY(-3px);
        }

        .result-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 18px 20px 14px 20px;
            position: relative;
            overflow: hidden;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .result-card .result-top {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 30px;
        }

        .result-card .result-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a2a5a;
            background: transparent;
            padding: 0 10px;
            display: inline-block;
        }

        .result-card .result-name i {
            color: #1976d2;
            margin-right: 6px;
        }

        .result-card .result-arrow {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            color: #d32f2f;
            font-size: 1.1rem;
            transition: transform 0.2s ease;
        }

        .result-card-wrapper:hover .result-arrow {
            transform: translateY(-50%) translateX(3px);
        }

        .result-card .result-address {
            font-size: 0.8rem;
            color: #8a9aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 2px;
        }

        .result-card .result-address i {
            color: #aab4c8;
        }

        .result-card .result-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .result-card .result-footer .footer-item {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            min-height: 34px;
        }

        .result-card .result-footer .badge-type {
            background: #e3edfb;
            color: #1976d2;
        }

        .result-card .result-footer .badge-country {
            background: #f0f2f5;
            color: #6b7a9a;
        }

        .result-card .result-footer .badge-source {
            background: #d4edda;
            color: #155724;
        }

        .result-card .result-footer .badge-source.local {
            background: #fff3cd;
            color: #856404;
        }

        /* ============================================================ */
        /* STATUT - VERT / ROUGE */
        /* ============================================================ */
        .result-card .result-footer .status {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            min-height: 34px;
        }

        .result-card .result-footer .status.open {
            background: #e8f5e9;
            color: #2ecc71;
        }

        .result-card .result-footer .status.closed {
            background: #fce4ec;
            color: #d32f2f;
        }

        .result-card .result-footer .status i {
            font-size: 0.6rem;
        }

        /* ============================================================ */
        /* SQUELETTE (SHIMMER) */
        /* ============================================================ */
        .skeleton-container {
            width: 100%;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .skeleton-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 8px;
            border: 1px solid #e8ecf4;
            width: 100%;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .skeleton-item .skeleton-line {
            height: 14px;
            border-radius: 6px;
            background: #e8ecf4;
            animation: shimmer 1.5s ease-in-out infinite;
            background: linear-gradient(90deg, #e8ecf4 25%, #f0f2f5 50%, #e8ecf4 75%);
            background-size: 200% 100%;
        }

        .skeleton-item .skeleton-line:nth-child(1) { width: 60%; height: 18px; }
        .skeleton-item .skeleton-line:nth-child(2) { width: 80%; }
        .skeleton-item .skeleton-line:nth-child(3) { width: 40%; }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ============================================================ */
        /* EMPTY STATE */
        /* ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8a9aaa;
        }

        .empty-state i {
            font-size: 3.5rem;
            color: #d0d5e0;
            display: block;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state .empty-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a2a5a;
        }

        .empty-state .empty-sub {
            font-size: 0.85rem;
            color: #aab4c8;
        }

        /* ============================================================ */
        /* OVERLAY REDIRECTION */
        /* ============================================================ */
        .redirect-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .redirect-overlay.active {
            display: flex;
            opacity: 1;
        }

        .redirect-overlay .wave-container {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 20px;
        }

        .redirect-overlay .wave-container .bar {
            width: 8px;
            height: 30px;
            background: #ffffff;
            border-radius: 4px;
            animation: waveOverlay 1.2s ease-in-out infinite;
        }

        .redirect-overlay .wave-container .bar:nth-child(1) { animation-delay: 0s; }
        .redirect-overlay .wave-container .bar:nth-child(2) { animation-delay: 0.1s; }
        .redirect-overlay .wave-container .bar:nth-child(3) { animation-delay: 0.2s; }
        .redirect-overlay .wave-container .bar:nth-child(4) { animation-delay: 0.3s; }
        .redirect-overlay .wave-container .bar:nth-child(5) { animation-delay: 0.4s; }
        .redirect-overlay .wave-container .bar:nth-child(6) { animation-delay: 0.5s; }
        .redirect-overlay .wave-container .bar:nth-child(7) { animation-delay: 0.6s; }
        .redirect-overlay .wave-container .bar:nth-child(8) { animation-delay: 0.7s; }

        @keyframes waveOverlay {
            0%, 40%, 100% {
                transform: scaleY(0.3);
                opacity: 0.3;
            }
            20% {
                transform: scaleY(1);
                opacity: 1;
            }
        }

        .redirect-overlay .redirect-text {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .redirect-overlay .redirect-text i {
            margin-right: 8px;
            opacity: 0.6;
        }

        /* ============================================================ */
        /* RESPONSIVE */
        /* ============================================================ */
        @media (max-width: 600px) {
            .header-search {
                height: 52px;
                padding: 0 10px;
                gap: 6px;
                border-radius: 30px;
                border-width: 2px;
            }

            .header-search input {
                font-size: 0.8rem;
                min-width: 50px;
            }

            .header-search .icon {
                font-size: 0.8rem;
            }

            .header-search .back-btn {
                font-size: 1rem;
                padding: 3px 5px;
            }

            .toggle-group .toggle-btn {
                font-size: 0.5rem;
                padding: 3px 8px;
            }

            .toggle-group .toggle-btn i {
                font-size: 0.55rem;
            }

            .source-badge {
                font-size: 0.45rem;
                padding: 2px 8px;
                gap: 4px;
            }

            .source-badge i {
                font-size: 0.5rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding-top: 68px;
            }

            .header-search {
                height: 48px;
                padding: 0 8px;
                gap: 4px;
                top: 10px;
                left: 10px;
                right: 10px;
                border-radius: 24px;
                max-width: 100%;
            }

            .header-search input {
                font-size: 0.75rem;
                min-width: 40px;
            }

            .header-search .back-btn {
                font-size: 0.9rem;
                padding: 2px 4px;
            }

            .header-search .icon {
                font-size: 0.7rem;
            }

            .header-search .clear-btn {
                font-size: 0.7rem;
            }

            .toggle-group .toggle-btn {
                font-size: 0.45rem;
                padding: 2px 6px;
                border-radius: 12px;
            }

            .toggle-group .toggle-btn i {
                font-size: 0.5rem;
            }

            .source-badge {
                font-size: 0.4rem;
                padding: 2px 6px;
                gap: 3px;
            }

            .source-badge i {
                font-size: 0.45rem;
            }

            .source-badge .badge-dot {
                width: 4px;
                height: 4px;
            }

            .results-container {
                padding: 0 10px;
                gap: 12px;
            }

            .result-card {
                padding: 14px 14px 10px 14px;
                min-height: 100px;
            }

            .result-card .result-top {
                padding: 0 24px;
            }

            .result-card .result-name {
                font-size: 0.95rem;
            }

            .result-card .result-address {
                font-size: 0.7rem;
            }

            .result-card .result-arrow {
                font-size: 0.95rem;
            }

            .result-card .result-footer .footer-item {
                font-size: 0.6rem;
                padding: 4px 12px;
                min-height: 28px;
            }

            .result-card .result-footer .status {
                font-size: 0.6rem;
                padding: 4px 12px;
                min-height: 28px;
            }

            .skeleton-container {
                padding: 0 10px;
                gap: 12px;
            }

            .skeleton-item {
                min-height: 100px;
                padding: 14px;
            }
        }

        @media (max-width: 380px) {
            .header-search {
                height: 42px;
                padding: 0 6px;
                gap: 3px;
                border-radius: 20px;
                border-width: 1.5px;
            }

            .header-search input {
                font-size: 0.65rem;
                min-width: 30px;
            }

            .toggle-group .toggle-btn {
                font-size: 0.4rem;
                padding: 1px 5px;
                border-radius: 10px;
            }

            .toggle-group .toggle-btn i {
                font-size: 0.4rem;
            }

            .source-badge {
                font-size: 0.35rem;
                padding: 1px 5px;
            }

            .source-badge i {
                font-size: 0.4rem;
            }

            .result-card .result-footer {
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }

            .result-card .result-top {
                padding: 0 20px;
            }

            .result-card .result-name {
                font-size: 0.85rem;
            }

            .result-card .result-address {
                font-size: 0.65rem;
            }

            .result-card .result-footer .footer-item {
                font-size: 0.55rem;
                padding: 3px 10px;
                min-height: 24px;
            }

            .result-card .result-footer .status {
                font-size: 0.55rem;
                padding: 3px 10px;
                min-height: 24px;
            }
        }

        /* ============================================================ */
        /* APPARITION PROGRESSIVE */
        /* ============================================================ */
        .result-card-wrapper {
            opacity: 0;
            transform: translateY(20px) scale(0.97);
            animation: resultAppear 0.4s ease forwards;
        }

        .result-card-wrapper:nth-child(1) { animation-delay: 0.05s; }
        .result-card-wrapper:nth-child(2) { animation-delay: 0.10s; }
        .result-card-wrapper:nth-child(3) { animation-delay: 0.15s; }
        .result-card-wrapper:nth-child(4) { animation-delay: 0.20s; }
        .result-card-wrapper:nth-child(5) { animation-delay: 0.25s; }
        .result-card-wrapper:nth-child(6) { animation-delay: 0.30s; }
        .result-card-wrapper:nth-child(7) { animation-delay: 0.35s; }
        .result-card-wrapper:nth-child(8) { animation-delay: 0.40s; }
        .result-card-wrapper:nth-child(9) { animation-delay: 0.45s; }
        .result-card-wrapper:nth-child(10) { animation-delay: 0.50s; }

        @keyframes resultAppear {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================================ */
        /* DÉSACTIVER LES EFFETS DE CLIC */
        /* ============================================================ */
        * {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
        }

        button:focus,
        input:focus,
        textarea:focus,
        select:focus,
        div:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        a:focus,
        a:active,
        button:active,
        .btn:active {
            outline: none !important;
            border-color: transparent !important;
            box-shadow: none !important;
        }

        * {
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- HEADER AVEC TOGGLES MONDE / LOCAL -->
    <!-- ============================================================ -->
    <header class="header-search" id="searchHeader">
        <button class="back-btn" id="backBtn" type="button" aria-label="Retour">
            <i class="fas fa-arrow-left"></i>
        </button>
        <i class="fas fa-search icon"></i>
        <input type="text" id="searchInput" placeholder="Rechercher un lieu..." autocomplete="off" />

        <!-- Togglés Monde / Local -->
        <div class="toggle-group" id="toggleGroup">
            <button class="toggle-btn active" data-mode="world" id="toggleWorld">
                <i class="fas fa-globe"></i> Monde
            </button>
            <button class="toggle-btn" data-mode="local" id="toggleLocal">
                <i class="fas fa-location-dot"></i> Local
            </button>
        </div>

        <button class="clear-btn" id="clearBtn" type="button" aria-label="Effacer">
            <i class="fas fa-times-circle"></i>
        </button>

        <span class="source-badge" id="sourceBadge">
            <span class="badge-dot"></span>
            <i class="fas fa-globe"></i> <span id="sourceLabel">Monde</span>
        </span>
    </header>

    <!-- ============================================================ -->
    <!-- RÉSULTATS -->
    <!-- ============================================================ -->
    <div class="results-container" id="resultsContainer">
        <div class="empty-state">
            <i class="fas fa-globe"></i>
            <div class="empty-title">Recherche mondiale</div>
            <div class="empty-sub">Tapez un lieu, une ville, un pays... partout dans le monde</div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- OVERLAY REDIRECTION -->
    <!-- ============================================================ -->
    <div class="redirect-overlay" id="redirectOverlay">
        <div class="wave-container">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div class="redirect-text">
            <i class="fas fa-spinner"></i> Veuillez patienter...
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- SCRIPT -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIGURATION SUPABASE (pour la recherche locale)
            // ============================================================
            var SUPABASE_URL = 'https://slanrdeaxapzfqtuqhbf.supabase.co';
            var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsYW5yZGVheGFwemZxdHVxaGJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzA3OTcsImV4cCI6MjEwMDkwNjc5N30.pUCb_N-66pjFs-QP2RefsqjAnffC4Rbq-rP9qHfnvK8';

            function getHeaders(token) {
                var headers = {
                    'apikey': SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json'
                };
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                } else {
                    headers['Authorization'] = 'Bearer ' + SUPABASE_ANON_KEY;
                }
                return headers;
            }

            function getSession() {
                try {
                    var session = localStorage.getItem('sb_session');
                    if (session) return JSON.parse(session);
                } catch (e) {}
                return null;
            }

            // ============================================================
            // DOM REFS
            // ============================================================
            var searchInput = document.getElementById('searchInput');
            var clearBtn = document.getElementById('clearBtn');
            var backBtn = document.getElementById('backBtn');
            var resultsContainer = document.getElementById('resultsContainer');
            var redirectOverlay = document.getElementById('redirectOverlay');
            var toggleWorld = document.getElementById('toggleWorld');
            var toggleLocal = document.getElementById('toggleLocal');
            var sourceLabel = document.getElementById('sourceLabel');

            var searchTimeout = null;
            var redirectTimer = null;
            var currentMode = 'world'; // 'world' | 'local'
            var allLocalPlaces = [];

            // ============================================================
            // CATÉGORIES
            // ============================================================
            var CATEGORIES = [
                { id: 'boutiques', label: 'Boutique', icon: 'fa-store' },
                { id: 'restaurants', label: 'Restaurant', icon: 'fa-utensils' },
                { id: 'domiciles', label: 'Domicile', icon: 'fa-house' },
                { id: 'cybercafes', label: 'Cybercafé', icon: 'fa-laptop' },
                { id: 'sante', label: 'Santé', icon: 'fa-heart-pulse' },
                { id: 'stations', label: 'Station', icon: 'fa-gas-pump' }
            ];

            var categoryIcons = {
                'restaurant': 'fa-utensils',
                'cafe': 'fa-mug-saucer',
                'hotel': 'fa-hotel',
                'shop': 'fa-store',
                'supermarket': 'fa-cart-shopping',
                'pharmacy': 'fa-prescription-bottle',
                'hospital': 'fa-hospital',
                'school': 'fa-school',
                'university': 'fa-university',
                'bank': 'fa-landmark',
                'church': 'fa-church',
                'mosque': 'fa-mosque',
                'park': 'fa-tree',
                'museum': 'fa-landmark',
                'theatre': 'fa-masks-theater',
                'cinema': 'fa-film',
                'library': 'fa-book-open',
                'sport': 'fa-futbol',
                'fuel': 'fa-gas-pump',
                'parking': 'fa-parking',
                'bus': 'fa-bus',
                'train': 'fa-train',
                'airport': 'fa-plane',
                'default': 'fa-location-dot'
            };

            function getCategoryIcon(category) {
                if (!category) return 'fa-location-dot';
                var cat = category.toLowerCase().trim();
                for (var key in categoryIcons) {
                    if (cat.includes(key)) {
                        return categoryIcons[key];
                    }
                }
                return 'fa-location-dot';
            }

            function getCategoryLabel(category) {
                if (!category) return 'Lieu';
                var cat = category.toLowerCase().trim();
                var labels = {
                    'restaurant': 'Restaurant',
                    'cafe': 'Café',
                    'hotel': 'Hôtel',
                    'shop': 'Boutique',
                    'supermarket': 'Supermarché',
                    'pharmacy': 'Pharmacie',
                    'hospital': 'Hôpital',
                    'school': 'École',
                    'university': 'Université',
                    'bank': 'Banque',
                    'church': 'Église',
                    'mosque': 'Mosquée',
                    'park': 'Parc',
                    'museum': 'Musée',
                    'theatre': 'Théâtre',
                    'cinema': 'Cinéma',
                    'library': 'Bibliothèque',
                    'fuel': 'Station essence',
                    'parking': 'Parking',
                    'bus': 'Arrêt bus',
                    'train': 'Gare',
                    'airport': 'Aéroport',
                    'default': 'Lieu'
                };
                for (var key in labels) {
                    if (cat.includes(key)) {
                        return labels[key];
                    }
                }
                return 'Lieu';
            }

            // ============================================================
            // GET CATEGORY INFO
            // ============================================================
            function getCategoryInfo(categoryId) {
                var categories = {
                    'boutiques': { label: 'Boutique', icon: 'fa-store' },
                    'restaurants': { label: 'Restaurant', icon: 'fa-utensils' },
                    'domiciles': { label: 'Domicile', icon: 'fa-house' },
                    'cybercafes': { label: 'Cybercafé', icon: 'fa-laptop' },
                    'sante': { label: 'Santé', icon: 'fa-heart-pulse' },
                    'stations': { label: 'Station', icon: 'fa-gas-pump' }
                };
                return categories[categoryId] || { label: 'Lieu', icon: 'fa-location-dot' };
            }

            // ============================================================
            // LOAD LOCAL PLACES (Supabase)
            // ============================================================
            async function loadLocalPlaces() {
                try {
                    var session = getSession();
                    var token = session ? session.access_token : null;

                    var response = await fetch(SUPABASE_URL + '/rest/v1/position?select=*&order=created_at.desc', {
                        headers: getHeaders(token)
                    });

                    if (!response.ok) {
                        throw new Error('Erreur ' + response.status);
                    }

                    allLocalPlaces = await response.json();
                    console.log('📌 ' + allLocalPlaces.length + ' lieux locaux chargés');

                } catch (e) {
                    console.error('❌ Erreur chargement lieux locaux:', e);
                    allLocalPlaces = [];
                }
            }

            // ============================================================
            // TOGGLE MODE
            // ============================================================
            function setMode(mode) {
                currentMode = mode;

                // Mettre à jour les toggles
                toggleWorld.classList.toggle('active', mode === 'world');
                toggleLocal.classList.toggle('active', mode === 'local');

                // Mettre à jour le badge
                if (mode === 'world') {
                    sourceLabel.textContent = 'Monde';
                    document.querySelector('.source-badge i').className = 'fas fa-globe';
                } else {
                    sourceLabel.textContent = 'Local';
                    document.querySelector('.source-badge i').className = 'fas fa-location-dot';
                }

                // Re-lancer la recherche si le champ n'est pas vide
                var query = searchInput.value.trim();
                if (query) {
                    performSearch(query);
                } else {
                    showEmptyState(mode);
                }
            }

            // ============================================================
            // EMPTY STATE
            // ============================================================
            function showEmptyState(mode) {
                var isWorld = (mode === 'world');
                resultsContainer.innerHTML =
                    '<div class="empty-state">' +
                    '<i class="fas ' + (isWorld ? 'fa-globe' : 'fa-location-dot') + '"></i>' +
                    '<div class="empty-title">' + (isWorld ? 'Recherche mondiale' : 'Recherche locale') + '</div>' +
                    '<div class="empty-sub">' + (isWorld ?
                        'Tapez un lieu, une ville, un pays... partout dans le monde' :
                        'Tapez un mot-clé pour chercher parmi les lieux locaux') +
                    '</div>' +
                    '</div>';
            }

            // ============================================================
            // PERFORM SEARCH
            // ============================================================
            function performSearch(query) {
                if (!query || query.trim() === '') {
                    showEmptyState(currentMode);
                    clearBtn.classList.remove('visible');
                    return;
                }

                clearBtn.classList.add('visible');

                if (currentMode === 'world') {
                    searchNominatim(query);
                } else {
                    searchLocal(query);
                }
            }

            // ============================================================
            // RECHERCHE NOMINATIM (Monde)
            // ============================================================
            var NOMINATIM_URL = 'https://nominatim.openstreetmap.org/search';

            function searchNominatim(query) {
                showSkeleton();

                var q = query.trim();
                var url = NOMINATIM_URL +
                    '?q=' + encodeURIComponent(q) +
                    '&format=json' +
                    '&addressdetails=1' +
                    '&limit=20' +
                    '&accept-language=fr';

                console.log('🌐 Nominatim:', url);

                fetch(url)
                    .then(function(response) {
                        if (!response.ok) {
                            throw new Error('Erreur ' + response.status);
                        }
                        return response.json();
                    })
                    .then(function(data) {
                        renderWorldResults(data);
                    })
                    .catch(function(error) {
                        console.error('❌ Erreur Nominatim:', error);
                        resultsContainer.innerHTML =
                            '<div class="empty-state">' +
                            '<i class="fas fa-exclamation-triangle"></i>' +
                            '<div class="empty-title">Erreur de recherche</div>' +
                            '<div class="empty-sub">' + error.message + '</div>' +
                            '</div>';
                    });
            }

            // ============================================================
            // RECHERCHE LOCALE (Supabase)
            // ============================================================
            function searchLocal(query) {
                showSkeleton();

                var q = query.toLowerCase().trim();

                setTimeout(function() {
                    var results = allLocalPlaces.filter(function(p) {
                        var cat = getCategoryInfo(p.category);
                        var catLabel = cat.label.toLowerCase();
                        return (p.name || '').toLowerCase().includes(q) ||
                            (p.address || '').toLowerCase().includes(q) ||
                            catLabel.includes(q);
                    });

                    renderLocalResults(results);
                }, 300);
            }

            // ============================================================
            // SQUELETTE
            // ============================================================
            function showSkeleton() {
                var html = '<div class="skeleton-container">';
                for (var i = 0; i < 5; i++) {
                    html +=
                        '<div class="skeleton-item">' +
                        '<div class="skeleton-line"></div>' +
                        '<div class="skeleton-line"></div>' +
                        '<div class="skeleton-line"></div>' +
                        '</div>';
                }
                html += '</div>';
                resultsContainer.innerHTML = html;
            }

            // ============================================================
            // RENDU RÉSULTATS MONDIAUX
            // ============================================================
            function renderWorldResults(data) {
                if (!data || data.length === 0) {
                    resultsContainer.innerHTML =
                        '<div class="empty-state">' +
                        '<i class="fas fa-search"></i>' +
                        '<div class="empty-title">Aucun résultat</div>' +
                        '<div class="empty-sub">Essayez avec d\'autres mots-clés</div>' +
                        '</div>';
                    return;
                }

                var html = '';
                data.forEach(function(item, index) {
                    var displayName = item.display_name || item.name || 'Lieu';
                    var address = item.display_name || 'Adresse non disponible';
                    var category = item.type || item.category || '';
                    var icon = getCategoryIcon(category);
                    var label = getCategoryLabel(category);
                    var country = (item.address && item.address.country) || 'Monde';
                    var lat = item.lat || 0;
                    var lon = item.lon || 0;

                    var nameParts = displayName.split(',');
                    var mainName = nameParts[0] || 'Lieu';

                    html +=
                        '<div class="result-card-wrapper" data-id="nominatim_' + (item.osm_id || index) +
                        '" data-lat="' + lat + '" data-lon="' + lon +
                        '" data-name="' + mainName.replace(/"/g, '&quot;') +
                        '" data-address="' + address.replace(/"/g, '&quot;') +
                        '" data-source="world">' +
                        '<div class="result-card">' +
                        '<div class="result-top">' +
                        '<span class="result-name"><i class="fas ' + icon + '"></i> ' + mainName + '</span>' +
                        '<span class="result-arrow"><i class="fas fa-chevron-right"></i></span>' +
                        '</div>' +
                        '<div class="result-address"><i class="fas fa-map-pin"></i> ' + address.substring(0, 100) +
                        '</div>' +
                        '<div class="result-footer">' +
                        '<span class="footer-item badge-type"><i class="fas ' + icon + '"></i> ' + label + '</span>' +
                        '<span class="footer-item badge-country"><i class="fas fa-flag"></i> ' + country + '</span>' +
                        '<span class="footer-item badge-source"><i class="fas fa-globe"></i> 🌍 Monde</span>' +
                        '</div>' +
                        '</div>' +
                        '</div>';
                });

                resultsContainer.innerHTML = html;
                bindClicks();
            }

            // ============================================================
            // RENDU RÉSULTATS LOCAUX (CORRIGÉ)
            // ============================================================
            function renderLocalResults(places) {
                if (!places || places.length === 0) {
                    resultsContainer.innerHTML =
                        '<div class="empty-state">' +
                        '<i class="fas fa-search"></i>' +
                        '<div class="empty-title">Aucun résultat local</div>' +
                        '<div class="empty-sub">Essayez avec d\'autres mots-clés</div>' +
                        '</div>';
                    return;
                }

                var html = '';
                places.forEach(function(place) {
                    var cat = getCategoryInfo(place.category);
                    var statusClass = place.status === 'open' ? 'open' : 'closed';
                    var statusLabel = place.status === 'open' ? 'Ouvert' : 'Fermé';
                    var statusIcon = place.status === 'open' ? 'fa-check-circle' : 'fa-times-circle';

                    html +=
                        '<div class="result-card-wrapper" data-id="' + place.id +
                        '" data-lat="' + place.lat + '" data-lon="' + place.lng +
                        '" data-name="' + place.name.replace(/"/g, '&quot;') +
                        '" data-address="' + (place.address || '').replace(/"/g, '&quot;') +
                        '" data-source="local">' +
                        '<div class="result-card">' +
                        '<div class="result-top">' +
                        '<span class="result-name"><i class="fas ' + cat.icon + '"></i> ' + place.name + '</span>' +
                        '<span class="result-arrow"><i class="fas fa-chevron-right"></i></span>' +
                        '</div>' +
                        '<div class="result-address"><i class="fas fa-map-pin"></i> ' + (place.address ||
                            'Adresse non renseignée') + '</div>' +
                        '<div class="result-footer">' +
                        '<span class="footer-item badge-type"><i class="fas ' + cat.icon + '"></i> ' + cat.label +
                        '</span>' +
                        '<span class="footer-item status ' + statusClass + '"><i class="fas ' + statusIcon + '"></i> ' +
                        statusLabel + '</span>' +
                        '<span class="footer-item badge-source local"><i class="fas fa-location-dot"></i> 📍 Local</span>' +
                        '</div>' +
                        '</div>' +
                        '</div>';
                });

                resultsContainer.innerHTML = html;
                bindClicks();
            }

            // ============================================================
            // BIND CLICKS SUR LES RÉSULTATS
            // ============================================================
            function bindClicks() {
                document.querySelectorAll('.result-card-wrapper').forEach(function(el) {
                    el.addEventListener('click', function(e) {
                        var id = this.dataset.id;
                        var lat = this.dataset.lat;
                        var lon = this.dataset.lon;
                        var name = this.dataset.name || 'Lieu';
                        var address = this.dataset.address || '';
                        var source = this.dataset.source || 'world';

                        // Rediriger vers info.html avec les paramètres
                        var url = 'info.html?place=' + encodeURIComponent(id) +
                            '&lat=' + encodeURIComponent(lat) +
                            '&lon=' + encodeURIComponent(lon) +
                            '&name=' + encodeURIComponent(name) +
                            '&address=' + encodeURIComponent(address) +
                            '&source=' + encodeURIComponent(source);

                        // Overlay de redirection
                        redirectOverlay.classList.add('active');
                        if (redirectTimer) clearTimeout(redirectTimer);
                        redirectTimer = setTimeout(function() {
                            window.location.href = url;
                        }, 800);

                        console.log('📍 Redirection vers:', url);
                    });
                });
            }

            // ============================================================
            // ÉVÉNEMENTS
            // ============================================================
            // Toggle Monde
            toggleWorld.addEventListener('click', function() {
                if (currentMode === 'world') return;
                setMode('world');
                var query = searchInput.value.trim();
                if (query) performSearch(query);
                else showEmptyState('world');
                searchInput.focus();
            });

            // Toggle Local
            toggleLocal.addEventListener('click', function() {
                if (currentMode === 'local') return;
                setMode('local');
                var query = searchInput.value.trim();
                if (query) performSearch(query);
                else showEmptyState('local');
                searchInput.focus();
            });

            // Recherche en temps réel
            searchInput.addEventListener('input', function() {
                var val = this.value;
                if (searchTimeout) clearTimeout(searchTimeout);
                searchTimeout = setTimeout(function() {
                    performSearch(val);
                }, 400);
            });

            // Effacer
            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                this.classList.remove('visible');
                showEmptyState(currentMode);
                searchInput.focus();
            });

            // Retour
            backBtn.addEventListener('click', function() {
                window.history.back();
            });

            // Enter
            searchInput.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    performSearch(this.value);
                }
            });

            // ============================================================
            // INIT
            // ============================================================
            async function init() {
                console.log('🔍 Recherche avec toggles Monde / Local');
                await loadLocalPlaces();
                setMode('world');
                searchInput.focus();
            }

            init();

        })();
    </script>

</body>
</html>
