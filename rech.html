<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🔍 Recherche - easily by megane</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />

    <style>
        /* ============================================================ */
        /* PAGE RECHERCHE - AVEC STYLE 9 */
        /* ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding-top: 76px;
            padding-bottom: 20px;
            margin: 0;
        }

        /* ============================================================ */
        /* HEADER - COMME INDEX.HTML */
        /* ============================================================ */
        .header-search {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            height: 60px;
            background: #ffffff;
            border-radius: 35px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 3px solid #1976d2;
            max-width: 480px;
            margin: 0 auto;
        }

        @media (min-width: 480px) {
            .header-search {
                left: 50%;
                transform: translateX(-50%);
                right: auto;
                top: 12px;
            }
        }

        .header-search .back-btn {
            background: none;
            border: none;
            color: #1976d2;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .header-search .back-btn:hover {
            background: #f0f2f5;
        }

        .header-search .icon {
            color: #1976d2;
            font-size: 1rem;
        }

        .header-search input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 0.95rem;
            color: #1a2a5a;
            background: transparent;
            height: 100%;
        }

        .header-search input::placeholder {
            color: #aab4c8;
        }

        .header-search .clear-btn {
            background: none;
            border: none;
            color: #aab4c8;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px;
            display: none;
        }

        .header-search .clear-btn.visible {
            display: block;
        }

        /* ============================================================ */
        /* CONTAINER RÉSULTATS - PLEINE LARGEUR */
        /* ============================================================ */
        .results-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        @media (max-width: 480px) {
            .results-container {
                padding: 0 10px;
                gap: 12px;
            }
        }

        /* ============================================================ */
        /* CARTE STYLE 9 - COMME MESPOSITIONS */
        /* ============================================================ */
        .result-card-wrapper {
            background: #ffffff;
            border-radius: 16px;
            padding: 8px;
            border: 1px solid #e8ecf4;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            cursor: pointer;
            width: 100%;
        }

        .result-card-wrapper:hover {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.10);
            transform: translateY(-3px);
        }

        .result-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 18px 20px 14px 20px;
            position: relative;
            overflow: hidden;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .result-card .result-top {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 30px;
        }

        .result-card .result-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a2a5a;
            background: transparent;
            padding: 0 10px;
            display: inline-block;
        }

        .result-card .result-name i {
            color: #1976d2;
            margin-right: 6px;
        }

        .result-card .result-arrow {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            color: #d32f2f;
            font-size: 1.1rem;
            transition: transform 0.2s ease;
        }

        .result-card-wrapper:hover .result-arrow {
            transform: translateY(-50%) translateX(3px);
        }

        .result-card .result-address {
            font-size: 0.8rem;
            color: #8a9aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 2px;
        }

        .result-card .result-address i {
            color: #aab4c8;
        }

        .result-card .result-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .result-card .result-footer .footer-item {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            min-height: 34px;
        }

        .result-card .result-footer .footer-item i {
            font-size: 0.6rem;
        }

        .result-card .result-footer .badge-category {
            background: #f0f2f5;
            color: #6b7a9a;
        }

        .result-card .result-footer .status {
            background: #e8f5e9;
            color: #2ecc71;
        }

        .result-card .result-footer .status.closed {
            background: #fce4ec;
            color: #d32f2f;
        }

        .result-card .result-footer .date-box {
            background: #e3edfb;
            color: #1976d2;
            border: 1px solid #dbeafe;
        }

        /* ============================================================ */
        /* SNIPPET 4 : SQUELETTE (SHIMMER) */
        /* ============================================================ */
        .skeleton-container {
            width: 100%;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .skeleton-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 8px;
            border: 1px solid #e8ecf4;
            width: 100%;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .skeleton-item .skeleton-line {
            height: 14px;
            border-radius: 6px;
            background: #e8ecf4;
            animation: shimmer 1.5s ease-in-out infinite;
            background: linear-gradient(90deg, #e8ecf4 25%, #f0f2f5 50%, #e8ecf4 75%);
            background-size: 200% 100%;
        }

        .skeleton-item .skeleton-line:nth-child(1) { width: 60%; height: 18px; }
        .skeleton-item .skeleton-line:nth-child(2) { width: 80%; }
        .skeleton-item .skeleton-line:nth-child(3) { width: 40%; }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ============================================================ */
        /* EMPTY STATE */
        /* ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8a9aaa;
        }

        .empty-state i {
            font-size: 3.5rem;
            color: #d0d5e0;
            display: block;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state .empty-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a2a5a;
        }

        .empty-state .empty-sub {
            font-size: 0.85rem;
            color: #aab4c8;
        }

        /* ============================================================ */
        /* OVERLAY REDIRECTION */
        /* ============================================================ */
        .redirect-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .redirect-overlay.active {
            display: flex;
            opacity: 1;
        }

        .redirect-overlay .wave-container {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 20px;
        }

        .redirect-overlay .wave-container .bar {
            width: 8px;
            height: 30px;
            background: #ffffff;
            border-radius: 4px;
            animation: waveOverlay 1.2s ease-in-out infinite;
        }

        .redirect-overlay .wave-container .bar:nth-child(1) { animation-delay: 0s; }
        .redirect-overlay .wave-container .bar:nth-child(2) { animation-delay: 0.1s; }
        .redirect-overlay .wave-container .bar:nth-child(3) { animation-delay: 0.2s; }
        .redirect-overlay .wave-container .bar:nth-child(4) { animation-delay: 0.3s; }
        .redirect-overlay .wave-container .bar:nth-child(5) { animation-delay: 0.4s; }
        .redirect-overlay .wave-container .bar:nth-child(6) { animation-delay: 0.5s; }
        .redirect-overlay .wave-container .bar:nth-child(7) { animation-delay: 0.6s; }
        .redirect-overlay .wave-container .bar:nth-child(8) { animation-delay: 0.7s; }

        @keyframes waveOverlay {
            0%, 40%, 100% {
                transform: scaleY(0.3);
                opacity: 0.3;
            }
            20% {
                transform: scaleY(1);
                opacity: 1;
            }
        }

        .redirect-overlay .redirect-text {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .redirect-overlay .redirect-text i {
            margin-right: 8px;
            opacity: 0.6;
        }

        /* ============================================================ */
        /* RESPONSIVE */
        /* ============================================================ */
        @media (max-width: 480px) {
            body {
                padding-top: 68px;
            }

            .header-search {
                height: 52px;
                padding: 0 16px;
                top: 10px;
                left: 10px;
                right: 10px;
                border-radius: 30px;
                border-width: 2px;
                max-width: 100%;
            }

            .header-search .title {
                font-size: 0.85rem;
            }

            .results-container {
                padding: 0 10px;
                gap: 12px;
            }

            .result-card {
                padding: 14px 14px 10px 14px;
                min-height: 100px;
            }

            .result-card .result-top {
                padding: 0 24px;
            }

            .result-card .result-name {
                font-size: 0.95rem;
            }

            .result-card .result-address {
                font-size: 0.7rem;
            }

            .result-card .result-arrow {
                font-size: 0.95rem;
            }

            .result-card .result-footer .footer-item {
                font-size: 0.6rem;
                padding: 4px 12px;
                min-height: 28px;
            }

            .result-card .result-footer .footer-item i {
                font-size: 0.5rem;
            }

            .skeleton-container {
                padding: 0 10px;
                gap: 12px;
            }

            .skeleton-item {
                min-height: 100px;
                padding: 14px;
            }

            .skeleton-item .skeleton-line:nth-child(1) { height: 16px; }
        }

        @media (max-width: 380px) {
            .result-card .result-footer {
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }

            .result-card .result-top {
                padding: 0 20px;
            }

            .result-card .result-name {
                font-size: 0.85rem;
            }

            .result-card .result-address {
                font-size: 0.65rem;
            }

            .result-card .result-footer .footer-item {
                font-size: 0.55rem;
                padding: 3px 10px;
                min-height: 24px;
            }
        }
        /* ============================================================ */
/* APPARITION PROGRESSIVE DES RÉSULTATS */
/* ============================================================ */

.result-card-wrapper {
    opacity: 0;
    transform: translateY(20px) scale(0.97);
    animation: resultAppear 0.4s ease forwards;
}

.result-card-wrapper:nth-child(1) { animation-delay: 0.05s; }
.result-card-wrapper:nth-child(2) { animation-delay: 0.10s; }
.result-card-wrapper:nth-child(3) { animation-delay: 0.15s; }
.result-card-wrapper:nth-child(4) { animation-delay: 0.20s; }
.result-card-wrapper:nth-child(5) { animation-delay: 0.25s; }
.result-card-wrapper:nth-child(6) { animation-delay: 0.30s; }
.result-card-wrapper:nth-child(7) { animation-delay: 0.35s; }
.result-card-wrapper:nth-child(8) { animation-delay: 0.40s; }
.result-card-wrapper:nth-child(9) { animation-delay: 0.45s; }
.result-card-wrapper:nth-child(10) { animation-delay: 0.50s; }
.result-card-wrapper:nth-child(11) { animation-delay: 0.55s; }
.result-card-wrapper:nth-child(12) { animation-delay: 0.60s; }
.result-card-wrapper:nth-child(13) { animation-delay: 0.65s; }
.result-card-wrapper:nth-child(14) { animation-delay: 0.70s; }
.result-card-wrapper:nth-child(15) { animation-delay: 0.75s; }

@keyframes resultAppear {
    0% {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- HEADER -->
    <!-- ============================================================ -->
    <header class="header-search" id="searchHeader">
        <button class="back-btn" id="backBtn" type="button" aria-label="Retour">
            <i class="fas fa-arrow-left"></i>
        </button>
        <i class="fas fa-search icon"></i>
        <input type="text" id="searchInput" placeholder="Rechercher un lieu..." autocomplete="off" />
        <button class="clear-btn" id="clearBtn" type="button" aria-label="Effacer">
            <i class="fas fa-times-circle"></i>
        </button>
    </header>

    <!-- ============================================================ -->
    <!-- RÉSULTATS -->
    <!-- ============================================================ -->
    <div class="results-container" id="resultsContainer">
        <div class="empty-state">
            <i class="fas fa-search"></i>
            <div class="empty-title">Recherchez un lieu</div>
            <div class="empty-sub">Tapez un mot-clé pour trouver un lieu</div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- OVERLAY REDIRECTION -->
    <!-- ============================================================ -->
    <div class="redirect-overlay" id="redirectOverlay">
        <div class="wave-container">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div class="redirect-text">
            <i class="fas fa-spinner"></i> Veuillez patienter...
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- SCRIPT -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // 🔑 CONFIGURATION SUPABASE
            // ============================================================
            var SUPABASE_URL = 'https://slanrdeaxapzfqtuqhbf.supabase.co';
            var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsYW5yZGVheGFwemZxdHVxaGJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzA3OTcsImV4cCI6MjEwMDkwNjc5N30.pUCb_N-66pjFs-QP2RefsqjAnffC4Rbq-rP9qHfnvK8';

            // ============================================================
            // CATÉGORIES
            // ============================================================
            var CATEGORIES = [
                { id: 'boutiques', label: 'Boutique', emoji: '🛍️', color: '#1976d2' },
                { id: 'restaurants', label: 'Restaurant', emoji: '🍽️', color: '#d32f2f' },
                { id: 'domiciles', label: 'Domicile', emoji: '🏠', color: '#2ecc71' },
                { id: 'cybercafes', label: 'Cybercafé', emoji: '💻', color: '#e67e22' },
                { id: 'sante', label: 'Santé', emoji: '🏥', color: '#e74c3c' },
                { id: 'stations', label: 'Station', emoji: '⛽', color: '#3498db' }
            ];

            // ============================================================
            // DOM REFS
            // ============================================================
            var searchInput = document.getElementById('searchInput');
            var clearBtn = document.getElementById('clearBtn');
            var backBtn = document.getElementById('backBtn');
            var resultsContainer = document.getElementById('resultsContainer');
            var redirectOverlay = document.getElementById('redirectOverlay');

            var searchTimeout = null;
            var redirectTimer = null;
            var allPlaces = [];

            // ============================================================
            // API HELPERS
            // ============================================================
            function getSession() {
                try {
                    var session = localStorage.getItem('sb_session');
                    if (session) return JSON.parse(session);
                } catch (e) {}
                return null;
            }

            function getHeaders(token) {
                var headers = {
                    'apikey': SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json'
                };
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                } else {
                    headers['Authorization'] = 'Bearer ' + SUPABASE_ANON_KEY;
                }
                return headers;
            }

            // ============================================================
            // CHARGER LES CATÉGORIES DEPUIS localStorage
            // ============================================================
            function loadSelectedCategories() {
                try {
                    var saved = localStorage.getItem('selectedCategories');
                    if (saved) {
                        var parsed = JSON.parse(saved);
                        return new Set(parsed);
                    }
                } catch (e) {}
                return new Set(CATEGORIES.map(function(c) { return c.id; }));
            }

            // ============================================================
            // CHARGER LES LIEUX AVEC PHOTOS
            // ============================================================
            async function loadPlaces() {
                try {
                    console.log('📥 Chargement des lieux depuis Supabase...');

                    var response = await fetch(SUPABASE_URL + '/rest/v1/position?select=*&order=created_at.desc', {
                        headers: getHeaders()
                    });

                    if (!response.ok) {
                        throw new Error('Erreur ' + response.status);
                    }

                    var places = await response.json();

                    if (!places || places.length === 0) {
                        console.log('📌 Aucun lieu trouvé');
                        allPlaces = [];
                        return;
                    }

                    console.log('📌 ' + places.length + ' lieu(x) chargé(s)');

                    // Récupérer les photos
                    var placeIds = places.map(function(p) { return p.id; });
                    var idsString = placeIds.map(function(id) { return '"' + id + '"'; }).join(',');

                    var photosResponse = await fetch(
                        SUPABASE_URL + '/rest/v1/photos?select=*&position_id=in.(' + idsString + ')', {
                            headers: getHeaders()
                        }
                    );

                    var photos = photosResponse.ok ? await photosResponse.json() : [];

                    var photosByPlace = {};
                    photos.forEach(function(photo) {
                        if (!photosByPlace[photo.position_id]) {
                            photosByPlace[photo.position_id] = [];
                        }
                        photosByPlace[photo.position_id].push(photo);
                    });

                    places.forEach(function(place) {
                        place.photos = photosByPlace[place.id] || [];
                    });

                    allPlaces = places;
                    console.log('📸 ' + photos.length + ' photo(s) chargée(s)');

                } catch (e) {
                    console.error('❌ Erreur chargement:', e);
                    allPlaces = [];
                }
            }

            // ============================================================
            // CATÉGORIE INFO
            // ============================================================
            function getCategoryInfo(categoryId) {
                var categories = {
                    'boutiques': { label: 'Boutique', icon: 'fa-store' },
                    'restaurants': { label: 'Restaurant', icon: 'fa-utensils' },
                    'domiciles': { label: 'Domicile', icon: 'fa-house' },
                    'cybercafes': { label: 'Cybercafé', icon: 'fa-laptop' },
                    'sante': { label: 'Santé', icon: 'fa-heart-pulse' },
                    'stations': { label: 'Station', icon: 'fa-gas-pump' }
                };
                return categories[categoryId] || { label: 'Non défini', icon: 'fa-location-dot' };
            }

            // ============================================================
            // REDIRECTION VERS INFO.HTML
            // ============================================================
            function redirectToInfo(placeId) {
                redirectOverlay.classList.add('active');
                if (redirectTimer) clearTimeout(redirectTimer);
                redirectTimer = setTimeout(function() {
                    window.location.href = 'info.html?place=' + placeId;
                }, 1200);
            }

            // ============================================================
            // SQUELETTE (SNIPPET 4)
            // ============================================================
            function showSkeleton() {
                var html = '<div class="skeleton-container">';
                for (var i = 0; i < 5; i++) {
                    html +=
                        '<div class="skeleton-item">' +
                        '<div class="skeleton-line"></div>' +
                        '<div class="skeleton-line"></div>' +
                        '<div class="skeleton-line"></div>' +
                        '</div>';
                }
                html += '</div>';
                resultsContainer.innerHTML = html;
            }

            // ============================================================
            // RENDU DES RÉSULTATS - STYLE 9
            // ============================================================
            function renderResults(places) {
                if (!places || places.length === 0) {
                    resultsContainer.innerHTML =
                        '<div class="empty-state">' +
                        '<i class="fas fa-search"></i>' +
                        '<div class="empty-title">Aucun résultat</div>' +
                        '<div class="empty-sub">Essayez avec d\'autres mots-clés</div>' +
                        '</div>';
                    return;
                }

                var html = '';
                places.forEach(function(place) {
                    var cat = getCategoryInfo(place.category);
                    var statusClass = place.status === 'open' ? 'open' : 'closed';
                    var statusLabel = place.status === 'open' ? 'Ouvert' : 'Fermé';
                    var statusIcon = place.status === 'open' ? 'fa-check-circle' : 'fa-times-circle';
                    var date = place.created_at ? new Date(place.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : 'N/A';

                    html +=
                        '<div class="result-card-wrapper" data-id="' + place.id + '">' +
                        '<div class="result-card">' +

                        '<div class="result-top">' +
                        '<span class="result-name">' +
                        '<i class="fas ' + cat.icon + '"></i> ' + place.name +
                        '</span>' +
                        '<span class="result-arrow"><i class="fas fa-chevron-right"></i></span>' +
                        '</div>' +

                        '<div class="result-address">' +
                        '<i class="fas fa-map-pin"></i> ' + (place.address || 'Adresse non renseignée') +
                        '</div>' +

                        '<div class="result-footer">' +
                        '<span class="footer-item badge-category"><i class="fas fa-tag"></i> ' + cat.label +
                        '</span>' +
                        '<span class="footer-item status ' + statusClass + '"><i class="fas ' + statusIcon + '"></i> ' +
                        statusLabel + '</span>' +
                        '<span class="footer-item date-box"><i class="fas fa-calendar-alt"></i> ' + date + '</span>' +
                        '</div>' +

                        '</div>' +
                        '</div>';
                });

                resultsContainer.innerHTML = html;

                // Clic sur un résultat → info.html
                document.querySelectorAll('.result-card-wrapper').forEach(function(el) {
                    el.addEventListener('click', function(e) {
                        var id = this.dataset.id;
                        redirectToInfo(id);
                    });
                });
            }

            // ============================================================
            // RECHERCHE
            // ============================================================
            function searchPlaces(query) {
                if (!query || query.trim() === '') {
                    resultsContainer.innerHTML =
                        '<div class="empty-state">' +
                        '<i class="fas fa-search"></i>' +
                        '<div class="empty-title">Recherchez un lieu</div>' +
                        '<div class="empty-sub">Tapez un mot-clé pour trouver un lieu</div>' +
                        '</div>';
                    clearBtn.classList.remove('visible');
                    return;
                }

                clearBtn.classList.add('visible');

                showSkeleton();

                var q = query.toLowerCase().trim();
                var selectedCategories = loadSelectedCategories();

                setTimeout(function() {
                    var results = allPlaces.filter(function(p) {
                        if (!selectedCategories.has(p.category)) return false;
                        var cat = CATEGORIES.find(function(c) { return c.id === p.category; });
                        var catLabel = cat ? cat.label.toLowerCase() : '';
                        return (p.name || '').toLowerCase().includes(q) ||
                            (p.address || '').toLowerCase().includes(q) ||
                            catLabel.includes(q);
                    });

                    renderResults(results);
                }, 600);
            }

            // ============================================================
            // ÉVÉNEMENTS
            // ============================================================

            searchInput.addEventListener('input', function() {
                var val = this.value;
                if (searchTimeout) clearTimeout(searchTimeout);
                searchTimeout = setTimeout(function() {
                    searchPlaces(val);
                }, 300);
            });

            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                this.classList.remove('visible');
                resultsContainer.innerHTML =
                    '<div class="empty-state">' +
                    '<i class="fas fa-search"></i>' +
                    '<div class="empty-title">Recherchez un lieu</div>' +
                    '<div class="empty-sub">Tapez un mot-clé pour trouver un lieu</div>' +
                    '</div>';
                searchInput.focus();
            });

            backBtn.addEventListener('click', function() {
                window.history.back();
            });

            searchInput.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    searchPlaces(this.value);
                }
            });

            // ============================================================
            // INIT
            // ============================================================
            async function init() {
                console.log('🔍 Recherche - Style 9');
                await loadPlaces();
                searchInput.focus();

                if (allPlaces.length === 0) {
                    console.log('📌 Aucun lieu trouvé');
                } else {
                    console.log('📌 ' + allPlaces.length + ' lieu(x) chargé(s)');
                    console.log('📌 Catégories sélectionnées:', [...loadSelectedCategories()]);
                }
            }

            init();

        })();
    </script>

</body>
</html>
